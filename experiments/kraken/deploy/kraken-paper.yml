name: Kraken four-hour paper research
on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: kraken-frozen-paper-ledger
  cancel-in-progress: false
jobs:
  paper:
    if: github.event.repository.private == false && vars.KRAKEN_PAPER_RUN_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: experiments/kraken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen Kraken release and checkpoint
        run: python tools/verify_release.py
      - name: Run one simulated Kraken cycle
        id: cycle
        run: python tools/run_cloud_once.py
      - name: Persist only independent simulated state
        if: always() && (steps.cycle.outcome == 'success' || steps.cycle.outcome == 'failure')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python tools/verify_release.py
          git config user.name 'paper-research-bot'
          git config user.email 'paper-research-bot@users.noreply.github.com'
          git add -- state/paper.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record independent Kraken paper checkpoint [skip ci]'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Show independent simulated account summary
        if: always()
        run: python tools/status.py >> "$GITHUB_STEP_SUMMARY"
